name: CI

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main, production]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Cache Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Cache MongoDB Memory Server
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-memory-server/
          key: mongoms-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: mongoms-${{ runner.os }}-

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint || echo "⚠️ Lint warnings found (non-blocking)"

      - name: Test
        run: bun test
        env:
          NODE_ENV: test
          MONGO_URI: mongodb://localhost:27017/test
          JWT_ACCESS_SECRET: ci-test-access-secret-min-32-chars-ok!
          JWT_REFRESH_SECRET: ci-test-refresh-secret-min-32-chars-ok!
          CORS_ORIGINS: http://localhost:3000
          RATE_LIMIT_WINDOW_MS: 900000
          RATE_LIMIT_MAX: 300
          MONGOMS_DOWNLOAD_TIMEOUT: 120000

      - name: Build
        run: bun run build
